# One service: Django web server (port 8000) + reverie.py, via start.sh, on Python 3.9.
#
#   cp reverie/backend_server/utils.py.example reverie/backend_server/utils.py   # then edit your key
#   docker compose up --build
#
# Then open http://localhost:8000/ . Stop with Ctrl+C or `docker compose down`.
services:
  habitat:
    build: .
    image: thehabitat:py39
    init: true                 # forwards Ctrl+C / docker stop to start.sh so both servers stop cleanly
    restart: unless-stopped
    ports:
      # Localhost for this machine. Set HABITAT_BIND to the Tailscale IPv4
      # (never 0.0.0.0: Django DEBUG is on) so other tailnet devices can connect.
      - "127.0.0.1:8000:8000"
      - "${HABITAT_BIND:-127.0.0.1}:8000:8000"
    environment:
      # 0.0.0.0 is required inside the container so the published port works.
      # WEB_HOST=tailscale does not apply here: there is no Tailscale in the container.
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      # Optional: simulation to fork from, and a fixed name for the new run.
      # An empty SIM_NAME means a new timestamped run on every start.
      FORK_SIM: ${FORK_SIM:-base_the_ville_isabella_maria_klaus}
      SIM_NAME: ${SIM_NAME:-}
    volumes:
      # Your API key and settings live in utils.py in this folder, which is not baked
      # into the image. The folder is mounted read-write so the web UI's /settings page
      # can save the key into utils.py (it swaps in a new file, which a single-file
      # mount cannot do). Create utils.py from utils.py.example before the first start.
      - ./reverie/backend_server:/app/reverie/backend_server
      # Persistent data. A new volume starts with the repo's copy of each folder.
      - habitat-run:/app/.habitat-run
      - habitat-storage:/app/environment/frontend_server/storage
      - habitat-temp-storage:/app/environment/frontend_server/temp_storage
      - habitat-compressed-storage:/app/environment/frontend_server/compressed_storage
      # Host views override. The image copies this file at build time.
      - type: bind
        source: ./environment/frontend_server/translator/views.py
        target: /app/environment/frontend_server/translator/views.py
        read_only: true
        bind:
          create_host_path: false
      # Host settings override. The image copies this file at build time, so a
      # bind is required for ALLOWED_HOSTS changes to apply without a rebuild.
      - type: bind
        source: ./environment/frontend_server/frontend_server/settings/local.py
        target: /app/environment/frontend_server/frontend_server/settings/local.py
        read_only: true
        bind:
          create_host_path: false

volumes:
  habitat-run:
  habitat-storage:
  habitat-temp-storage:
  habitat-compressed-storage:
